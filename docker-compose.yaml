version: "3.8"

x-spark-common-env: &spark-common-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  NESSIE_URI: ${NESSIE_URI}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  SPARK_MASTER_URL: ${SPARK_MASTER_URL}

#------------------------------------------------------------

services:
  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console port
    volumes:
      - minio-data:/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create MinIO buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/landing-bucket --ignore-existing;
      mc mb minio/bronze-bucket --ignore-existing;
      mc mb minio/silver-bucket --ignore-existing;
      mc mb minio/gold-bucket --ignore-existing;
      echo 'Buckets created successfully';
      "
    networks:
      - spark-network

  # Spark Master
  spark-master:
    build:
      context: ./spark_config
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8888:8888"
      - "7077:7077"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      <<: *spark-common-env
    volumes:
      - ./dataset:/opt/spark/dataset:ro
      - ./spark/jobs:/opt/spark/jobs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - spark-network

  spark-worker:
    build:
      context: ./spark_config
      dockerfile: Dockerfile
    container_name: spark-worker
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 3g
      - spark://spark-master:7077
    environment:
      <<: *spark-common-env
    volumes:
      - ./dataset:/opt/spark/dataset:ro
      - ./spark/jobs:/opt/spark/jobs:ro
    depends_on:
      - spark-master
    networks:
      - spark-network

# -----------------------------------------------------------------------------

  db:
    image: postgres:15
    container_name: postgres
    ports:
      - ${POSTGRES_PORT}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spark-network
    
  af:
      container_name: airflow_container
      build: ./airflow
      image: apache/airflow:3.0.0
      ports:
        - "8000:8080"
      environment:
        AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@db:5432/airflow_db
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./dataset:/usr/local/airflow/dataset
      depends_on:
        - db
      command: >
        bash -c "airflow db migrate && airflow standalone"
      networks:
        - spark-network


# -----------------------------------------------------------------------------

  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    volumes:
    - ./dbt/localiza:/usr/app
    - ./dbt:/root/.dbt
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: "/root/.dbt"
    depends_on:
      - db
    networks:
      - spark-network
    command: debug

# -----------------------------------------------------------------------------

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 60s
    networks:
      - spark-network

  superset-init:
    image: python:3.11-slim
    container_name: superset-init
    depends_on:
      superset:
        condition: service_healthy
      dremio:
        condition: service_healthy
    environment:
      SUPERSET_HOST: superset
      SUPERSET_PORT: "8088"
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      DREMIO_HOST: dremio
      DREMIO_PORT: "9047"
      DREMIO_USERNAME: ${DREMIO_USERNAME}
      DREMIO_PASSWORD: ${DREMIO_PASSWORD}
    volumes:
      - ./superset/init_dashboard.py:/init_dashboard.py:ro
    entrypoint: >
      /bin/sh -c "pip install -q requests && python /init_dashboard.py"
    restart: "no"
    networks:
      - spark-network

  dremio:
    image: dremio/dremio-oss:24.3.0
    container_name: dremio
    restart: on-failure
    ports:
      - "9047:9047"   # REST API + UI
      - "31010:31010" # JDBC/ODBC
      - "45678:45678" # Arrow Flight
    volumes:
      - dremio-data:/opt/dremio/data
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///opt/dremio/data/dist
        -Xmx1500m
        -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9047 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 60s
    networks:
      - spark-network

  dremio-setup:
    image: python:3.11-slim
    container_name: dremio-setup
    depends_on:
      dremio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    environment:
      DREMIO_HOST: dremio
      DREMIO_PORT: "9047"
      DREMIO_USERNAME: ${DREMIO_USERNAME}
      DREMIO_PASSWORD: ${DREMIO_PASSWORD}
      NESSIE_URI: ${NESSIE_URI}
      NESSIE_URI_V2: ${NESSIE_URI_V2}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: >
      /bin/sh -c "pip install -q requests && python /scripts/setup_dremio.py"
    restart: "no"
    networks:
      - spark-network

volumes:
  minio-data:
  spark-logs:

networks:
  spark-network:
    driver: bridge
    name: spark-minio-network